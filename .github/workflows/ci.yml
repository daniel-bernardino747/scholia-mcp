name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scholia
          POSTGRES_PASSWORD: scholia
          POSTGRES_DB: scholia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholia"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://scholia:scholia@localhost:5432/scholia_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest -q
