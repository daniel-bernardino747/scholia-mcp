[project]
name = "scholia-mcp"
version = "0.1.0"
description = "Self-hosted second brain for AI agents: distilled notes saved and recalled through a remote MCP server."
license = "MIT"
authors = [
    { name = "daniel-bernardino747", email = "106272711+daniel-bernardino747@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
scholia-mcp = "scholia_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
